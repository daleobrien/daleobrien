# Publishes site/ to status.do.id.au: the S3 bucket behind its CloudFront
# distribution (made by daleobrien/mums-websites). Runs when site/ changes on
# main, or by hand from the Actions tab. Uploads under web/static/ also trigger
# the CloudFront invalidation set up in mums-websites.
#
# Set once in this repository's Settings → Secrets and variables → Actions,
# as for maze-website:
#   - secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, or instead secret
#     AWS_ROLE_ARN: an IAM role this repository may assume through GitHub's
#     OpenID Connect provider (no long-lived keys). Either needs s3:PutObject
#     and s3:DeleteObject on arn:aws:s3:::status-do-id-au/web/static/* and
#     s3:ListBucket on arn:aws:s3:::status-do-id-au.
#   - variable AWS_REGION: the bucket's region (ap-southeast-2 without it).

name: Status site

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/minify.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  # For the OpenID Connect role, when AWS_ROLE_ARN is set.
  id-token: write

concurrency:
  group: status-site
  cancel-in-progress: false

env:
  BUCKET_PATH: s3://status-do-id-au/web/static/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      # site/ copied to dist/ with the HTML squeezed (whitespace and comments only).
      - name: Build
        run: python3 tools/minify.py site dist

      # The files are small and keep their names, so browsers always check them
      # (no-cache); anything no longer in site/ is removed.
      - name: Upload
        run: aws s3 sync dist/ "$BUCKET_PATH" --delete --cache-control no-cache

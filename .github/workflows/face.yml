name: Update face

on:
  # Sent by the iPhone Shortcuts automations when Sleep Focus turns on or off.
  repository_dispatch:
    types: [sleep, wake]
  # Clock fallback, only around 7am and 7pm Melbourne time. Cron is UTC and Melbourne is
  # UTC+11 in summer, UTC+10 in winter, so cover both hours: 8-9 UTC (evening), 20-21 UTC
  # (morning). Runs at :10, with one retry at :30 in case GitHub drops a scheduled run.
  # It does nothing if the phone has reported in the last 16 hours.
  schedule:
    - cron: "10,30 8,9,20,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face
  cancel-in-progress: false

jobs:
  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out awake or asleep
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: python3 scripts/update_face.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          state=$(python3 -c 'import json; print(json.load(open("status.json"))["state"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Face: ${state}"
          git pull --rebase
          git push

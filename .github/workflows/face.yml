name: Update face

on:
  # Sent by the iPhone Shortcuts automations when a Focus turns on (<mode>) or off
  # (<mode>-off). sleep and wake are the Sleep Focus ones.
  repository_dispatch:
    types:
      - sleep
      - wake
      - work
      - work-off
      - driving
      - driving-off
      - fitness
      - fitness-off
      - gaming
      - gaming-off
      - reading
      - reading-off
      - mindfulness
      - mindfulness-off
      - dnd
      - dnd-off
      - personal
      - personal-off
  # Clock nudge: at 10pm Melbourne time go to sleep if still awake, at 7am wake up if still
  # asleep. Cron is UTC and Melbourne is UTC+11 in summer, UTC+10 in winter, so each needs
  # two UTC hours: 11-12 UTC (10pm), 20-21 UTC (7am). The script checks the local hour, so
  # the off-season run does nothing. :10 with a retry at :30 in case GitHub drops a run.
  schedule:
    - cron: "10,30 11,12,20,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: face
  cancel-in-progress: false

jobs:
  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out awake or asleep
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: python3 scripts/update_face.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          state=$(python3 -c 'import json; print(json.load(open("status.json"))["state"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Face: ${state}"
          git pull --rebase
          git push

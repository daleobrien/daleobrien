name: Update face

on:
  schedule:
    # Only around 7am and 7pm Melbourne time. Cron is UTC and Melbourne is UTC+11 in
    # summer, UTC+10 in winter, so cover both hours: 8-9 UTC (evening), 20-21 UTC (morning).
    # Runs at :10, with one retry at :30 in case GitHub drops a scheduled run.
    # The script decides using Melbourne time and only commits on a change.
    - cron: "10,30 8,9,20,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pick awake or asleep
        run: |
          hour=$(TZ=Australia/Melbourne date +%-H)
          if [ "$hour" -ge 7 ] && [ "$hour" -lt 19 ]; then state=awake; else state=asleep; fi
          sed -i -E "s#faces/(awake|asleep)-#faces/${state}-#g; s#Dale is (awake|asleep)#Dale is ${state}#" README.md
          if git diff --quiet; then echo "Already ${state}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Face: ${state}"
          git push

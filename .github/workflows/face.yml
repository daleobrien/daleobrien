name: Update face

on:
  schedule:
    # GitHub often delays or drops scheduled runs, so check every 15 minutes.
    # The script decides using Melbourne time (DST handled) and only commits on a change.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pick awake or asleep
        run: |
          hour=$(TZ=Australia/Melbourne date +%-H)
          if [ "$hour" -ge 7 ] && [ "$hour" -lt 19 ]; then state=awake; else state=asleep; fi
          sed -i -E "s#faces/(awake|asleep)-#faces/${state}-#g; s#Dale is (awake|asleep)#Dale is ${state}#" README.md
          if git diff --quiet; then echo "Already ${state}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Face: ${state}"
          git push
